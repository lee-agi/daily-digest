[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "daily-digest"
version = "0.17.1"
description = "Multi-source daily digest aggregator for OpenClaw"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "feedparser>=6.0",
    "httpx[socks]>=0.27",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.8",
    "twikit>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring real API credentials",
]
